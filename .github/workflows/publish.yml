name: Publish to PyPI

# Publishes the `plasma-app` sdist + wheel on version tags. Uses PyPI
# Trusted Publishing (OIDC) — no API token stored in this repo. Before the
# first release, register this workflow as a trusted publisher at
# https://pypi.org/manage/project/plasma-app/settings/publishing/
# (or, before the project exists yet, via the "pending publisher" flow at
# https://pypi.org/manage/account/publishing/) with:
#   owner: YuyiChang   repo: PLASMA   workflow: publish.yml   environment: pypi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[all,test]"

      - name: Run tests
        run: pytest

  check-version:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match plasma.__version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"(.*)\"", pathlib.Path("plasma/__init__.py").read_text())[1])')"
          echo "tag=$TAG package=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG does not match plasma.__version__ ($PKG_VERSION)"
            exit 1
          fi

  build:
    needs: test
    # only build+publish off a version tag; workflow_dispatch is for a manual
    # TestPyPI dry run of whatever's on the current branch
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check long description / metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: [check-version, build]
    # check-version is skipped (not failed) on workflow_dispatch, so gate on
    # build succeeding rather than requiring every need to have "succeeded"
    if: always() && needs.build.result == 'success' && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_pypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_pypi) && 'https://test.pypi.org/project/plasma-app/' || 'https://pypi.org/project/plasma-app/' }}
    permissions:
      id-token: write  # trusted publishing (OIDC) — no stored token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: "!(github.event_name == 'workflow_dispatch' && inputs.test_pypi)"
        uses: pypa/gh-action-pypi-publish@release/v1
