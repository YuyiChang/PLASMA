name: Dispatch nightly dev build

# GitHub's cron trigger runs only on the default branch. Dispatch explicitly
# to dev so the actual build uses dev's workflow definition and source commit.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-dev-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build.yml on dev
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'build.yml',
              ref: 'dev',
              inputs: { nightly: 'true' }
            });
            core.notice('Dispatched nightly build on dev. Follow the Build PLASMA workflow for build and publication results.');
