name: Build PLASMA

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    # nightly build off the default branch's HEAD, published as a rolling
    # "nightly" pre-release (tag moves to the new commit each run) rather
    # than a versioned vX.Y.Z release — see the release steps below.
    - cron: '0 7 * * *'   # 07:00 UTC daily

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[all,test]"

      - name: Run tests
        run: pytest

  build-macos:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: plasma

      - name: Stamp git commit hash
        shell: bash -el {0}
        run: python .github/stamp_commit.py ${{ github.sha }}

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge liblsl -y
          pip install -e ".[all,build]"

      - name: Build
        shell: bash -el {0}
        run: pyinstaller app_macos.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash -el {0}
        env:
          PLASMA_BIN: dist/PLASMA_MacOS_arm64
        run: bash .github/smoke_test.sh

      # .app bundle for the Homebrew cask / a double-clickable Applications
      # icon — see build_macos_app.sh for why this isn't PyInstaller's own
      # BUNDLE() (console=True there implies LSBackgroundOnly=True, which
      # hides the app and any startup failure along with it).
      - name: Build .app bundle
        shell: bash -el {0}
        run: |
          VERSION="$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"(.*)\"", pathlib.Path("plasma/__init__.py").read_text())[1])')"
          bash .github/build_macos_app.sh dist/PLASMA_MacOS_arm64 "$VERSION"

      - name: Verify .app structure
        shell: bash -el {0}
        run: |
          rm -rf /tmp/plasma_app_check
          ditto -x -k dist/PLASMA_MacOS_arm64.app.zip /tmp/plasma_app_check
          test -x /tmp/plasma_app_check/PLASMA.app/Contents/MacOS/PLASMA
          test -x /tmp/plasma_app_check/PLASMA.app/Contents/Resources/plasma-bin
          plutil -lint /tmp/plasma_app_check/PLASMA.app/Contents/Info.plist

      # sha256 for the Homebrew cask (Casks/plasma.rb) — pin the download to
      # a known-good checksum rather than trusting the tarball at bump time.
      - name: Checksum
        shell: bash -el {0}
        run: |
          shasum -a 256 dist/PLASMA_MacOS_arm64 > dist/PLASMA_MacOS_arm64.sha256
          shasum -a 256 dist/PLASMA_MacOS_arm64.app.zip > dist/PLASMA_MacOS_arm64.app.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-MacOS-arm64
          path: |
            dist/PLASMA_MacOS_arm64
            dist/PLASMA_MacOS_arm64.sha256
            dist/PLASMA_MacOS_arm64.app.zip
            dist/PLASMA_MacOS_arm64.app.zip.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: |
            dist/PLASMA_MacOS_arm64
            dist/PLASMA_MacOS_arm64.sha256
            dist/PLASMA_MacOS_arm64.app.zip
            dist/PLASMA_MacOS_arm64.app.zip.sha256

  build-linux:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: plasma

      - name: Stamp git commit hash
        shell: bash -el {0}
        run: python .github/stamp_commit.py ${{ github.sha }}

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge liblsl -y
          pip install -e ".[all,build]"

      - name: Build
        shell: bash -el {0}
        run: pyinstaller app_linux.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash -el {0}
        env:
          PLASMA_BIN: dist/PLASMA_Linux_x64
        run: bash .github/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Linux-x64
          path: dist/PLASMA_Linux_x64

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: dist/PLASMA_Linux_x64

  build-linux-arm64:
    # aarch64 build for NVIDIA Jetson Orin — targets JetPack 6 (Ubuntu 22.04 /
    # glibc 2.35), so it must build on the jammy ARM runner (not 24.04-arm).
    # No conda: conda-forge has no linux-aarch64 liblsl — take it from the
    # sccn/liblsl release .deb instead. The qb2 LiDAR plugin is omitted
    # (blickfeld-qb2 is sdist-only on aarch64); it stays in the catalog and
    # only errors if a LiDAR is Initialized.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04-arm
    env:
      LIBLSL_VERSION: "1.17.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install liblsl (aarch64)
        run: |
          V="${LIBLSL_VERSION}"
          curl -fsSL -o liblsl.deb \
            "https://github.com/sccn/liblsl/releases/download/v$V/liblsl-$V-jammy_arm64.deb"
          sudo apt-get update
          sudo apt-get install -y ./liblsl.deb
          # bundle the shared object under the plain `liblsl.so` name pylsl's
          # loader expects. Package name comes from the .deb itself (sccn names
          # it `liblsl`, Ubuntu's is `liblsl2`).
          PKG="$(dpkg-deb -f liblsl.deb Package)"
          SO="$(dpkg -L "$PKG" | grep -E '/liblsl\.so(\.[0-9]+)+$' | sort -V | tail -1)"
          test -n "$SO"
          mkdir -p "$RUNNER_TEMP/lsl"
          cp "$(readlink -f "$SO")" "$RUNNER_TEMP/lsl/liblsl.so"
          echo "PYLSL_LIB=$RUNNER_TEMP/lsl/liblsl.so" >> "$GITHUB_ENV"

      - name: Stamp git commit hash
        run: python .github/stamp_commit.py ${{ github.sha }}

      - name: Install dependencies
        run: pip install -e ".[msense,pupil,shimmer,obs,build]"

      - name: Build
        run: pyinstaller app_linux.spec --noconfirm

      - name: Smoke test (clean dir)
        env:
          PLASMA_BIN: dist/PLASMA_Linux_arm64
        run: bash .github/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Linux-arm64
          path: dist/PLASMA_Linux_arm64

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: dist/PLASMA_Linux_arm64

  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp git commit hash
        run: python .github/stamp_commit.py ${{ github.sha }}

      - name: Install dependencies
        run: pip install -e ".[all,build]"

      - name: Build
        run: pyinstaller app_windows.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash
        env:
          PLASMA_BIN: dist/PLASMA_Windows_x64.exe
        run: bash .github/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Windows-x64
          path: dist/PLASMA_Windows_x64.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: dist/PLASMA_Windows_x64.exe
