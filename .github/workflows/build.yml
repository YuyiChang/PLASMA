name: Build PLASMA

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    # nightly build off `dev`'s HEAD (not the repo's default branch — a
    # `schedule` trigger has no branch filter of its own, so every checkout
    # step below pins `ref: dev` for this event explicitly), published as a
    # rolling "nightly" pre-release (tag moves to the new commit each run)
    # rather than a versioned vX.Y.Z release — see the release steps below.
    - cron: '0 7 * * *'   # 07:00 UTC daily

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[all,test]"

      - name: Run tests
        run: pytest

  build-macos:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: plasma

      - name: Stamp git commit hash
        shell: bash -el {0}
        run: python .github/stamp_commit.py $(git rev-parse HEAD)

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge liblsl -y
          pip install -e ".[all,build]"

      - name: Build
        shell: bash -el {0}
        run: pyinstaller app_macos.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash -el {0}
        env:
          PLASMA_BIN: dist/PLASMA_MacOS_arm64/PLASMA_MacOS_arm64
        run: bash .github/smoke_test.sh

      # .app bundle for the Homebrew cask / a double-clickable Applications
      # icon — see build_macos_app.sh for why this isn't PyInstaller's own
      # BUNDLE() (console=True there implies LSBackgroundOnly=True, which
      # hides the app and any startup failure along with it).
      - name: Build .app bundle
        shell: bash -el {0}
        run: |
          VERSION="$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"(.*)\"", pathlib.Path("plasma/__init__.py").read_text())[1])')"
          bash .github/build_macos_app.sh dist/PLASMA_MacOS_arm64 "$VERSION"

      # No-op (unsigned build, unchanged) unless the MACOS_CERTIFICATE_*/
      # MACOS_NOTARY_* secrets are set — see
      # docs/reference/release-process.md for how to obtain/configure them.
      - name: Codesign + notarize .app
        shell: bash -el {0}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: bash .github/codesign_notarize_macos.sh

      # ditto (not zip) preserves the bundle's permissions/resource forks/
      # xattrs correctly — the standard way to archive a .app for
      # distribution. Done here (after signing), not in build_macos_app.sh,
      # so the zip always contains the final, possibly-signed bundle.
      - name: Zip .app bundle
        shell: bash -el {0}
        run: ditto -c -k --sequesterRsrc --keepParent dist/PLASMA.app dist/PLASMA_MacOS_arm64.app.zip

      - name: Verify .app structure
        shell: bash -el {0}
        run: |
          rm -rf /tmp/plasma_app_check
          ditto -x -k dist/PLASMA_MacOS_arm64.app.zip /tmp/plasma_app_check
          test -x /tmp/plasma_app_check/PLASMA.app/Contents/MacOS/PLASMA
          test -x /tmp/plasma_app_check/PLASMA.app/Contents/Resources/PLASMA_MacOS_arm64/PLASMA_MacOS_arm64
          plutil -lint /tmp/plasma_app_check/PLASMA.app/Contents/Info.plist

      # drag-to-install DMG, for anyone who'd rather not use the Homebrew cask
      - name: Build DMG
        shell: bash -el {0}
        run: bash .github/build_macos_dmg.sh dist/PLASMA.app

      - name: Verify DMG
        shell: bash -el {0}
        run: hdiutil verify dist/PLASMA_MacOS_arm64.dmg

      # raw, installer-free download — a zip of the onedir folder (exe +
      # its support-files directory; the two must stay together)
      - name: Zip raw onedir folder
        shell: bash -el {0}
        run: (cd dist && zip -qry PLASMA_MacOS_arm64.zip PLASMA_MacOS_arm64)

      # sha256 for the Homebrew cask (Casks/plasma.rb) — pin the download to
      # a known-good checksum rather than trusting the tarball at bump time.
      - name: Checksum
        shell: bash -el {0}
        run: |
          shasum -a 256 dist/PLASMA_MacOS_arm64.zip > dist/PLASMA_MacOS_arm64.zip.sha256
          shasum -a 256 dist/PLASMA_MacOS_arm64.app.zip > dist/PLASMA_MacOS_arm64.app.zip.sha256
          shasum -a 256 dist/PLASMA_MacOS_arm64.dmg > dist/PLASMA_MacOS_arm64.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-MacOS-arm64
          path: |
            dist/PLASMA_MacOS_arm64.zip
            dist/PLASMA_MacOS_arm64.zip.sha256
            dist/PLASMA_MacOS_arm64.app.zip
            dist/PLASMA_MacOS_arm64.app.zip.sha256
            dist/PLASMA_MacOS_arm64.dmg
            dist/PLASMA_MacOS_arm64.dmg.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: |
            dist/PLASMA_MacOS_arm64.zip
            dist/PLASMA_MacOS_arm64.zip.sha256
            dist/PLASMA_MacOS_arm64.app.zip
            dist/PLASMA_MacOS_arm64.app.zip.sha256
            dist/PLASMA_MacOS_arm64.dmg
            dist/PLASMA_MacOS_arm64.dmg.sha256

  build-linux:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: plasma

      - name: Stamp git commit hash
        shell: bash -el {0}
        run: python .github/stamp_commit.py $(git rev-parse HEAD)

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge liblsl -y
          pip install -e ".[all,build]"

      - name: Build
        shell: bash -el {0}
        run: pyinstaller app_linux.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash -el {0}
        env:
          PLASMA_BIN: dist/PLASMA_Linux_x64/PLASMA_Linux_x64
        run: bash .github/smoke_test.sh

      # tar (not zip) to preserve the executable bit on the onedir folder
      - name: Archive onedir folder
        shell: bash -el {0}
        run: tar -C dist -czf dist/PLASMA_Linux_x64.tar.gz PLASMA_Linux_x64

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Linux-x64
          path: dist/PLASMA_Linux_x64.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: dist/PLASMA_Linux_x64.tar.gz

  build-linux-arm64:
    # aarch64 build for NVIDIA Jetson Orin — targets JetPack 6 (Ubuntu 22.04 /
    # glibc 2.35), so it must build on the jammy ARM runner (not 24.04-arm).
    # No conda: conda-forge has no linux-aarch64 liblsl — take it from the
    # sccn/liblsl release .deb instead. The qb2 LiDAR plugin is omitted
    # (blickfeld-qb2 is sdist-only on aarch64); it stays in the catalog and
    # only errors if a LiDAR is Initialized.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04-arm
    env:
      LIBLSL_VERSION: "1.17.7"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install liblsl (aarch64)
        run: |
          V="${LIBLSL_VERSION}"
          curl -fsSL -o liblsl.deb \
            "https://github.com/sccn/liblsl/releases/download/v$V/liblsl-$V-jammy_arm64.deb"
          sudo apt-get update
          sudo apt-get install -y ./liblsl.deb
          # bundle the shared object under the plain `liblsl.so` name pylsl's
          # loader expects. Package name comes from the .deb itself (sccn names
          # it `liblsl`, Ubuntu's is `liblsl2`).
          PKG="$(dpkg-deb -f liblsl.deb Package)"
          SO="$(dpkg -L "$PKG" | grep -E '/liblsl\.so(\.[0-9]+)+$' | sort -V | tail -1)"
          test -n "$SO"
          mkdir -p "$RUNNER_TEMP/lsl"
          cp "$(readlink -f "$SO")" "$RUNNER_TEMP/lsl/liblsl.so"
          echo "PYLSL_LIB=$RUNNER_TEMP/lsl/liblsl.so" >> "$GITHUB_ENV"

      - name: Stamp git commit hash
        run: python .github/stamp_commit.py $(git rev-parse HEAD)

      - name: Install dependencies
        run: pip install -e ".[msense,pupil,shimmer,obs,build]"

      - name: Build
        run: pyinstaller app_linux.spec --noconfirm

      - name: Smoke test (clean dir)
        env:
          PLASMA_BIN: dist/PLASMA_Linux_arm64/PLASMA_Linux_arm64
        run: bash .github/smoke_test.sh

      # tar (not zip) to preserve the executable bit on the onedir folder
      - name: Archive onedir folder
        run: tar -C dist -czf dist/PLASMA_Linux_arm64.tar.gz PLASMA_Linux_arm64

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Linux-arm64
          path: dist/PLASMA_Linux_arm64.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: dist/PLASMA_Linux_arm64.tar.gz

  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp git commit hash
        shell: bash
        run: python .github/stamp_commit.py $(git rev-parse HEAD)

      - name: Install dependencies
        run: pip install -e ".[all,build]"

      - name: Build
        run: pyinstaller app_windows.spec --noconfirm

      - name: Smoke test (clean dir)
        shell: bash
        env:
          PLASMA_BIN: dist/PLASMA_Windows_x64/PLASMA_Windows_x64.exe
        run: bash .github/smoke_test.sh

      - name: Compute version
        shell: bash
        run: |
          VERSION="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"(.*)\"", pathlib.Path("plasma/__init__.py").read_text())[1])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # raw, installer-free download — a zip of the onedir folder (exe +
      # its support-files directory; the two must stay together)
      - name: Zip raw onedir folder
        shell: pwsh
        run: Compress-Archive -Path dist\PLASMA_Windows_x64\* -DestinationPath dist\PLASMA_Windows_x64.zip

      # unsigned — first run shows a SmartScreen "unknown publisher" warning,
      # same as today's raw unsigned .exe (see packaging/windows/plasma_installer.iss)
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION packaging\windows\plasma_installer.iss'

      # the .iss script can't be built/tested on the macOS dev machine this
      # was written on — silently install the built installer and re-run the
      # smoke test against the installed copy as the real correctness check
      - name: Smoke test installed copy
        shell: pwsh
        run: Start-Process "dist\PLASMA_Windows_x64_Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=C:\PLASMA_installed" -Wait

      - name: Smoke test installed copy (verify)
        shell: bash
        env:
          PLASMA_BIN: /c/PLASMA_installed/PLASMA_Windows_x64.exe
        run: bash .github/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Windows-x64
          path: |
            dist/PLASMA_Windows_x64.zip
            dist/PLASMA_Windows_x64_Setup.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
          name: ${{ github.event_name == 'schedule' && 'Nightly build' || github.ref_name }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: |
            dist/PLASMA_Windows_x64.zip
            dist/PLASMA_Windows_x64_Setup.exe
